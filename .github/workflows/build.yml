name: tortoisegit-portable-release-actions-workflow
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # e.g. v2.19.2.0
      - 'c*'
  workflow_dispatch:

permissions:
  contents: write # needed to create/update the release

jobs:
  build:
    name: Create Release
    runs-on: windows-latest
    env:
      # TortoiseGit release to package. Download folders are named after the
      # minor release (2.19.0.0), the files after the exact build (2.19.2.0).
      TGIT_VERSION: 2.19.2.0
      LESSMSI_VERSION: 2.12.9
      # TortoiseGit location written into the bundled context-menu .reg files.
      # Users who unpack elsewhere must regenerate them (see README).
      CONTEXT_MENU_ROOT: C:\Apps\tortoisegit
      targetZip: tortoisegit-portable-${{ github.ref_name }}.zip
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download installer
        run: |
          $v = [version]$env:TGIT_VERSION
          $url = "https://download.tortoisegit.org/tgit/$($v.Major).$($v.Minor).0.0/TortoiseGit-$env:TGIT_VERSION-64bit.msi"
          Write-Host "Downloading $url"
          Invoke-WebRequest $url -OutFile installer.msi

      - name: Verify installer signature
        run: |
          $sig = Get-AuthenticodeSignature installer.msi
          Write-Host "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'CN=Open Source Developer Sven Strickroth') {
            throw 'installer.msi is not validly signed by the TortoiseGit maintainer'
          }

      - name: Download lessmsi
        run: |
          Invoke-WebRequest "https://github.com/activescott/lessmsi/releases/download/v$env:LESSMSI_VERSION/lessmsi-v$env:LESSMSI_VERSION.zip" -OutFile lessmsi.zip
          Expand-Archive lessmsi.zip -DestinationPath lessmsi -Force

      - name: Extract installer
        run: |
          if (Test-Path installation) { Remove-Item installation -Recurse -Force }
          .\lessmsi\lessmsi.exe x installer.msi "installation\"
          if ($LASTEXITCODE) { throw "lessmsi failed with exit code $LASTEXITCODE" }

      - name: Locate and check portable folder
        run: |
          $proc = Get-ChildItem installation -Recurse -Filter TortoiseGitProc.exe | Select-Object -First 1
          if (-not $proc) { throw 'TortoiseGitProc.exe not found in extracted MSI' }
          $root = $proc.Directory.Parent.FullName  # ...\TortoiseGit (contains bin\)
          $found = $proc.VersionInfo.ProductVersion
          Write-Host "Portable root: $root (TortoiseGitProc $found)"
          if ($found -ne $env:TGIT_VERSION) { throw "Expected $env:TGIT_VERSION, got $found" }
          "PORTABLE_ROOT=$root" >> $env:GITHUB_ENV

      - name: Generate context menu .reg files
        run: |
          # Icons are validated against the extracted DLL; paths in the files point at CONTEXT_MENU_ROOT.
          python scripts/context_menu.py --root $env:PORTABLE_ROOT --reg-root $env:CONTEXT_MENU_ROOT --export-reg $env:PORTABLE_ROOT
          if ($LASTEXITCODE) { throw "context_menu.py failed with exit code $LASTEXITCODE" }

      - name: Archive release
        run: |
          if (Test-Path $env:targetZip) { Remove-Item $env:targetZip }
          Compress-Archive -Path "$env:PORTABLE_ROOT\*" -DestinationPath $env:targetZip
          $zip = Get-Item $env:targetZip
          Write-Host "$($zip.Name): $([math]::Round($zip.Length / 1MB, 1)) MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tortoisegit-portable-${{ env.TGIT_VERSION }}
          path: ${{ env.targetZip }}
          compression-level: 0 # already a zip

      - name: Release prebuilt
        if: ${{ !env.ACT }} # skipped when testing locally with act
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.targetZip }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
